[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mksite"
version = "0.1.0"
description = "A zero-dependency static site generator built on the Python standard library"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "mksite contributors" }]
requires-python = ">=3.9"
keywords = ["static-site-generator", "markdown", "ssg", "blog", "zero-dependency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/Chenjie-Prog/mksite"
Repository = "https://github.com/Chenjie-Prog/mksite"
Issues = "https://github.com/Chenjie-Prog/mksite/issues"

[project.scripts]
mksite = "mksite.cli:main"

[tool.setuptools]
packages = ["mksite"]
